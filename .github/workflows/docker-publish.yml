name: docker publish

# Builds the SVscanner container and publishes it to the GitHub Container Registry.
#
# Tags vX.Y.Z publish ghcr.io/<owner>/svscanner:X.Y.Z, :X.Y and :latest. Pull requests
# that touch the container build it and run the smoke tests without publishing, so a
# broken base image bump is caught before a release rather than during one.
#
# version-check.yml already guarantees that a vX.Y.Z tag sits on a commit whose VERSION
# file says X.Y.Z, so the image tag and `svscanner --version` cannot drift apart. The
# smoke test asserts it anyway.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/svscanner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=ci-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      # Built into the local daemon first so the smoke tests run against the exact
      # image that is about to be published. The push below is a cache hit.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: svscanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - tools and versions
        run: |
          set -euo pipefail
          docker run --rm svscanner:ci svscanner --version
          docker run --rm svscanner:ci /opt/svscanner/scripts/check_required_python.sh
          docker run --rm svscanner:ci bash -eu -c '
            for tool in trf RepeatMasker parallel bcftools bgzip tabix; do
              command -v "$tool" || { echo "missing from PATH: $tool" >&2; exit 1; }
            done
            # Run them, do not just resolve them: bcftools links libhts dynamically and
            # has been shipped before in a state where it resolved but could not start.
            # No pipes - a pipeline would report the last command status and hide that.
            bcftools --version
            bgzip --version
            tabix --version
            RepeatMasker -v
          '

      - name: Smoke test - image version matches the VERSION file
        run: |
          set -euo pipefail
          expected=$(cat VERSION)
          reported=$(docker run --rm svscanner:ci svscanner --version)
          echo "VERSION file: ${expected}"
          echo "image says  : ${reported}"
          [[ "${reported}" == "SVscanner v${expected}" ]] \
            || { echo "::error::image reports '${reported}', expected 'SVscanner v${expected}'"; exit 1; }

      # The container ships without a clade database, so --dfam_dir is the only way it
      # can annotate anything. Exercise the library assembly directly: a full run needs
      # a 57 GB partition and a reference genome, neither of which belongs in CI.
      - name: Smoke test - external Dfam library assembly
        run: |
          set -euo pipefail
          mkdir -p fake_dfam
          echo "not a real partition" > fake_dfam/dfam39_full.7.h5
          docker run --rm -v "${PWD}/fake_dfam:/dfam:ro" svscanner:ci bash -eu -c '
            # Stand in a library cache of the kind a used RepeatMasker install accumulates.
            # It must NOT be inherited: its name records the database version but not which
            # partitions built it, so with --dfam_dir it is stale by construction and
            # RepeatMasker would reuse it silently.
            mkdir -p /opt/RepeatMasker/Libraries/CONS-Dfam_3.9/human
            echo stale > /opt/RepeatMasker/Libraries/CONS-Dfam_3.9/human/specieslib

            { echo "die() { echo -e \"\$1\" >&2; exit 1; }"
              sed -n "/^setup_dfam_library()/,/^}/p" /opt/svscanner/scripts/run_workflow.sh
            } > /tmp/harness.sh
            REPEAT_MASKER=$(command -v RepeatMasker) DFAM_DIR=/dfam RM_LIBDIR=/tmp/rm_libraries \
              bash -c "source /tmp/harness.sh; setup_dfam_library"

            # The root partition must come from the image and the clade partition from the mount.
            test -e /tmp/rm_libraries/famdb/dfam39_full.0.h5
            test "$(readlink -f /tmp/rm_libraries/famdb/dfam39_full.7.h5)" = /dfam/dfam39_full.7.h5
            test -e /tmp/rm_libraries/RepeatPeps.lib
            # ... and the stale cache must have been left behind.
            test ! -e /tmp/rm_libraries/CONS-Dfam_3.9
          '

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
